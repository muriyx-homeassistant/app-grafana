name: Edge

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: matrix
        shell: bash
        run: |
          matrix="$(bash .github/scripts/build-matrix.sh grafana/build.yaml)"
          echo "value=${matrix}" >> "$GITHUB_OUTPUT"

      - id: version
        shell: bash
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-pr:
    if: github.event_name == 'pull_request'
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image metadata
        id: image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/grafana/${ARCH}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: grafana
          file: grafana/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.image.outputs.date }}
            BUILD_DESCRIPTION=Grafana with VictoriaMetrics datasource support
            BUILD_NAME=Grafana
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=grafana-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=grafana-${{ matrix.arch }}

  build:
    if: github.event_name == 'push'
    needs: metadata
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/grafana/${ARCH}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: grafana
          file: grafana/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.image.outputs.date }}
            BUILD_DESCRIPTION=Grafana with VictoriaMetrics datasource support
            BUILD_NAME=Grafana
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=grafana-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=grafana-${{ matrix.arch }}

  publish-edge:
    if: github.event_name == 'push'
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Notify edge catalog
        shell: bash
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [[ -z "${CATALOG_TOKEN}" ]]; then
            echo "::warning::CATALOG_TOKEN is not configured; edge catalog update skipped"
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export GH_TOKEN="${CATALOG_TOKEN}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY_OWNER}/repository-edge/dispatches" \
            -f event_type='publish-app' \
            -F client_payload[source_repository]="${GITHUB_REPOSITORY}" \
            -F client_payload[source_sha]="${GITHUB_SHA}" \
            -F client_payload[source_path]='grafana' \
            -F client_payload[slug]='grafana' \
            -F client_payload[version]="${VERSION}" \
            -F client_payload[image]="ghcr.io/${owner}/grafana/{arch}"
