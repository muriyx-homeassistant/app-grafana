name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - id: matrix
        shell: bash
        run: |
          matrix="$(bash .github/scripts/build-matrix.sh grafana/build.yaml)"
          echo "value=${matrix}" >> "$GITHUB_OUTPUT"

      - id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or 1.2.3; got: ${TAG}" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/grafana/${ARCH}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: grafana
          file: grafana/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.metadata.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ steps.image.outputs.date }}
            BUILD_DESCRIPTION=Grafana with VictoriaMetrics datasource support
            BUILD_NAME=Grafana
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=grafana-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=grafana-${{ matrix.arch }}

  publish-stable:
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Notify stable catalog
        shell: bash
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if [[ -z "${CATALOG_TOKEN}" ]]; then
            echo "::warning::CATALOG_TOKEN is not configured; stable catalog update skipped"
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export GH_TOKEN="${CATALOG_TOKEN}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY_OWNER}/repository/dispatches" \
            -f event_type='publish-app' \
            -F client_payload[source_repository]="${GITHUB_REPOSITORY}" \
            -F client_payload[source_sha]="${GITHUB_SHA}" \
            -F client_payload[source_path]='grafana' \
            -F client_payload[slug]='grafana' \
            -F client_payload[version]="${VERSION}" \
            -F client_payload[image]="ghcr.io/${owner}/grafana/{arch}"
